name: Build

# Every push to main produces a build, and the "latest" release is replaced
# with it. That release is what the in-app updater looks at, so its body has to
# carry both the version and the commit in a shape the updater can parse.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while one of these is running makes the first one pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build reads the commit out of git to bake into the binary, so
          # it needs the history rather than a bare tree.
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Every dependency is fetched and built by CMake on the first configure -
      # FLAC, Opus, Vorbis, Ogg, opusfile, SpeexDSP, RNNoise, the VST3
      # interfaces, Signalsmith Stretch and the ASIO SDK. That is most of the
      # build time, and none of it changes unless third_party does.
      - name: Cache the build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/CMakeLists.txt') }}
          # A change to either file starts from the last build rather than
          # from nothing.
          restore-keys: build-${{ runner.os }}-

      - name: Configure
        # No -G: the runner image moves to a newer Visual Studio from
        # time to time, and naming one that is not there fails before it
        # builds anything. CMake picks the newest it finds.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # FastRoute runs on Windows 7. An import Windows 7 lacks stops it from
      # starting at all, and a newer toolchain can bring one in without
      # anybody noticing until somebody on Windows 7 reports that nothing
      # happens when they double-click it.
      - name: Check it still runs on Windows 7
        shell: pwsh
        run: |
          $win8Only = 'CreateFile2|CopyFile2|GetSystemTimePreciseAsFileTime|' +
                      'WaitOnAddress|WakeByAddress|SetThreadDescription|' +
                      'GetThreadDescription|GetCurrentThreadStackLimits|' +
                      'FromApp|PrefetchVirtualMemory|GetOverlappedResultEx|' +
                      'api-ms-win-'
          $found = dumpbin /imports build\Release\FastRoute.exe |
                   Select-String -Pattern $win8Only
          if ($found) {
            Write-Host "FastRoute.exe imports functions Windows 7 does not have:"
            $found | ForEach-Object { Write-Host $_.Line.Trim() }
            exit 1
          }
          Write-Host "No Windows 8 or later imports."

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path src\version.h `
                             -Pattern '#define FASTROUTE_VERSION\s+"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          Write-Host "Version: $v"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # dist.ps1 already knows what goes in a release: the exe and everything
      # under docs. -SkipBuild because it has just been built.
      - name: Package
        run: .\dist.ps1 -Configuration Release -SkipBuild

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist\FastRoute-*-x64.zip

  release:
    needs: build-windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download the zip
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/

      - name: List what will be released
        run: ls -la artifacts/

      # Replaced rather than added to, so "latest" is always exactly one build.
      - name: Remove the previous latest
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # The body carries the version and the commit in fixed shapes, because
      # the in-app updater reads them out of it. A build from the server can
      # then be compared by commit, which is exact, and by version when the
      # running copy was built without one.
      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}

            **Version:** ${{ needs.build-windows.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            ${{ github.event.head_commit.message }}

            This release is replaced on every push to main, and is what the
            updater inside FastRoute checks.

            ## Download

            **FastRoute-${{ needs.build-windows.outputs.version }}-x64.zip** -
            unpack it anywhere and run FastRoute.exe. Settings live beside the
            program, so the whole folder can go on a memory stick.

            Windows 7 SP1 or later, 64 bit.
          files: artifacts/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
